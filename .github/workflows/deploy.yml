name: Criar arquivo de configuração com Secrets

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Criar arquivo de configuração com Secrets
        run: |
          echo "// ============================================" > js/config.js
          echo "// CONFIGURAÇÕES DO SISTEMA (GERADO AUTOMATICAMENTE)" >> js/config.js
          echo "// ============================================" >> js/config.js
          echo "" >> js/config.js
          echo "const CONFIG = {" >> js/config.js
          echo "  GOOGLE_CLIENT_ID: '${{ secrets.GOOGLE_CLIENT_ID }}'," >> js/config.js
          echo "  GOOGLE_CLIENT_SECRET: '${{ secrets.GOOGLE_CLIENT_SECRET }}'," >> js/config.js
          echo "  RESEND_API_KEY: '${{ secrets.RESEND_API_KEY }}'" >> js/config.js
          echo "};" >> js/config.js
          echo "" >> js/config.js
          echo "console.log('✅ Configuração carregada do GitHub Actions!');" >> js/config.js

      - name: Commit e push do arquivo config.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/config.js
          git commit -m "feat: atualizar configurações com secrets [skip ci]" || echo "Nenhuma mudança para commitar"
          git push