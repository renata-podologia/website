<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Podologia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #5c8374;
            --primary-dark: #3b564b;
            --background: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2b3a42;
            --border-color: #d1dcd6;
            --error-color: #dc3545;
            --success-color: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h2 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 25px;
            font-weight: 600;
        }

        .form-step {
            display: none;
        }

        .form-step.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary-dark);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        .horarios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .horario-btn {
            padding: 10px;
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .horario-btn:hover {
            background-color: #e2e8e6;
        }

        .horario-btn.selecionado {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        button.btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.3s;
        }

        button.btn:hover {
            background-color: var(--primary-dark);
        }

        button.btn-secondary {
            background-color: #6c757d;
        }

        button.btn-secondary:hover {
            background-color: #5a6268;
        }

        .mensagem-alerta {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Agendamento de Atendimento</h2>
    
    <form id="agendamento-form">
        <!-- Passo 1: Informações Pessoais -->
        <div class="form-step active" id="step-1">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Digite seu nome completo">
            </div>
            <div class="form-group">
                <label for="telefone">Telefone / WhatsApp</label>
                <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>
            <div class="btn-container">
                <div></div>
                <button type="button" class="btn" onclick="proximoPasso(2)">Avançar</button>
            </div>
        </div>

        <!-- Passo 2: Tipo e Serviço -->
        <div class="form-step" id="step-2">
            <div class="form-group">
                <label for="tipo">Tipo de Atendimento</label>
                <select id="tipo" required>
                    <option value="">Selecione...</option>
                    <option value="Consultório">Consultório</option>
                    <option value="Domiciliar">Domiciliar</option>
                </select>
            </div>
            <div class="form-group">
                <label for="servico">Serviço Desejado</label>
                <select id="servico" required>
                    <option value="">Carregando serviços...</option>
                </select>
            </div>
            <div class="btn-container">
                <button type="button" class="btn btn-secondary" onclick="proximoPasso(1)">Voltar</button>
                <button type="button" class="btn" onclick="proximoPasso(3)">Avançar</button>
            </div>
        </div>

        <!-- Passo 3: Data e Horário -->
        <div class="form-step" id="step-3">
            <div class="form-group">
                <label for="data">Data do Agendamento</label>
                <input type="date" id="data" required onchange="carregarHorarios()">
            </div>
            <div class="form-group">
                <label>Horários Disponíveis</label>
                <div id="horarios-grid" class="horarios-grid">
                    <p style="grid-column: 1 / -1; font-size: 0.9rem; color: #666;">Selecione uma data acima para visualizar os horários.</p>
                </div>
            </div>
            <div class="btn-container">
                <button type="button" class="btn btn-secondary" onclick="proximoPasso(2)">Voltar</button>
                <button type="button" class="btn" onclick="finalizarAgendamento()">Confirmar Agendamento</button>
            </div>
        </div>
    </form>
    
    <div id="mensagem" class="mensagem-alerta"></div>
</div>

<script>
    // Substitua pela URL da sua Web App do Google Apps Script
    const URL_API = 'SUA_URL_DO_WEB_APP_AQUI';
    
    let dadosFormulario = {
        nome: '',
        telefone: '',
        email: '',
        tipo: '',
        servico: '',
        data: '',
        hora: ''
    };

    function proximoPasso(passo) {
        if (passo === 2) {
            dadosFormulario.nome = document.getElementById('nome').value.trim();
            dadosFormulario.telefone = document.getElementById('telefone').value.trim();
            dadosFormulario.email = document.getElementById('email').value.trim();

            if (!dadosFormulario.nome || !dadosFormulario.telefone || !dadosFormulario.email) {
                alert('Preencha todos os campos obrigatórios antes de continuar.');
                return;
            }
            carregarServicos();
        }

        if (passo === 3) {
            dadosFormulario.tipo = document.getElementById('tipo').value;
            dadosFormulario.servico = document.getElementById('servico').value;

            if (!dadosFormulario.tipo || !dadosFormulario.servico) {
                alert('Selecione o tipo de atendimento e o serviço.');
                return;
            }
        }

        document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));
        document.getElementById(`step-${passo}`).classList.add('active');
    }

    function carregarServicos() {
        const selectServico = document.getElementById('servico');
        fetch(`${URL_API}?acao=servicos`)
            .then(res => res.json())
            .then(res => {
                if (res.sucesso && res.servicos) {
                    selectServico.innerHTML = '<option value="">Selecione o serviço...</option>';
                    res.servicos.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.servico;
                        opt.textContent = s.servico;
                        selectServico.appendChild(opt);
                    });
                } else {
                    selectServico.innerHTML = '<option value="">Erro ao carregar serviços</option>';
                }
            })
            .catch(() => {
                selectServico.innerHTML = '<option value="">Erro de conexão</option>';
            });
    }

    function carregarHorarios() {
        const dataInput = document.getElementById('data').value;
        const grid = document.getElementById('horarios-grid');

        if (!dataInput) return;

        grid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando...</div>';
        dadosFormulario.data = dataInput;

        fetch(`${URL_API}?acao=disponibilidade&data=${dataInput}`)
            .then(res => res.json())
            .then(res => {
                grid.innerHTML = '';
                if (res.sucesso) {
                    if (res.horarios.length === 0) {
                        grid.innerHTML = '<p style="grid-column: 1 / -1; color: #dc3545; font-size: 0.9rem;">Nenhum horário disponível para esta data.</p>';
                        return;
                    }

                    res.horarios.forEach(hora => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'horario-btn';
                        btn.textContent = hora;
                        btn.onclick = () => {
                            document.querySelectorAll('.horario-btn').forEach(b => b.classList.remove('selecionado'));
                            btn.classList.add('selecionado');
                            dadosFormulario.hora = hora;
                        };
                        grid.appendChild(btn);
                    });
                } else {
                    grid.innerHTML = `<p style="grid-column: 1 / -1; color: #dc3545; font-size: 0.9rem;">${res.erro || 'Erro ao carregar horários.'}</p>`;
                }
            })
            .catch(() => {
                grid.innerHTML = '<p style="grid-column: 1 / -1; color: #dc3545; font-size: 0.9rem;">Erro de conexão com o servidor.</p>';
            });
    }

    function finalizarAgendamento() {
        if (!dadosFormulario.data || !dadosFormulario.hora) {
            alert('Selecione uma data e um horário válido.');
            return;
        }

        const msgDiv = document.getElementById('mensagem');
        msgDiv.style.color = '#5c8374';
        msgDiv.textContent = 'Realizando agendamento...';

        fetch(URL_API, {
            method: 'POST',
            body: JSON.stringify(dadosFormulario),
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            }
        })
        .then(res => res.json())
        .then(res => {
            if (res.sucesso) {
                msgDiv.style.color = 'var(--success-color)';
                msgDiv.textContent = 'Agendamento realizado com sucesso!';
                setTimeout(() => {
                    window.location.reload();
                }, 3000);
            } else {
                msgDiv.style.color = 'var(--error-color)';
                msgDiv.textContent = res.erro || 'Erro ao realizar agendamento.';
            }
        })
        .catch(() => {
            msgDiv.style.color = 'var(--error-color)';
            msgDiv.textContent = 'Erro de comunicação ao enviar os dados.';
        });
    }
</script>

</body>
</html>
